<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Recorder library</title>
<link rel="stylesheet" href="styles.css">
<body>
  <main class="page">
    <div class="bar">
      <a class="brand" href="library.html"><img src="icons/icon-48.png" alt="">Call Recorder</a>
      <a class="quiet-link" href="setup.html">Settings</a>
    </div>
    <div class="stack">
      <h1>Your recordings</h1>
      <p class="lead">Saved on this computer. Nothing is uploaded.</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-recordings" aria-selected="true">Recordings</button>
      <button class="tab" role="tab" id="tab-transcripts" aria-selected="false">Transcripts</button>
    </div>
    <p class="notice err" id="error" hidden></p>
    <div id="pane-recordings" role="tabpanel">
      <section class="stack" id="list" aria-live="polite"></section>
      <p class="empty card" id="empty" hidden>No recordings yet. Open a call tab, click the extension icon and press Start.</p>
    </div>
    <div id="pane-transcripts" role="tabpanel" class="stack" hidden></div>
  </main>
  <script src="library.js"></script>
</body>
</html>
